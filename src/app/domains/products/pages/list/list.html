<!-- Hereda el header y los margenes de layout, por lo que aqui solo nos importa el contenido unico que genera -->
<div class="grid grid-cols-4 gap-5 mt-5">
  @if (list()) {
    @for (item of list(); track $index) {
      <app-product [product]="item" />
    }
  } @else {
    <p>No hay productos a la venta :c</p>
  }
</div>
