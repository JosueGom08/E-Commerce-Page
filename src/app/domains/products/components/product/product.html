<div class="bg-neutral-primary-soft border border-default rounded-base shadow-xs">
  <a href="#">
    <img class="rounded-t-base" [src]="product()?.image" [alt]="product()?.name" />
  </a>
  <div class="p-6 text-center">
    <span
      class="inline-flex items-center bg-brand-softer text-fg-brand-strong text-2xl font-bold px-1.5 py-0.5 rounded-sm"
    >
      {{ product()?.name }}
    </span>
    <h5 class="mt-1 mb-1 text-md font-semibold tracking-tight text-heading">
      {{ product()?.description }}
    </h5>
    <h5 class="mt-3 mb-6 text-lg font-semibold tracking-tight text-heading">
      Q. {{ product()?.price }} .00
    </h5>
    <h5 class="mt-3 mb-6 text-sm font-semibold tracking-tight text-heading">
      {{ product()?.creationAt }}
    </h5>
    <a
      style="cursor: pointer"
      (click)="addProduct()"
      class="inline-flex items-center text-black bg-blue-400 rounded-md border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none"
    >
      Add to Cart!
      <svg
        class="w-4 h-4 ms-1.5 rtl:rotate-180 -me-0.5"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M19 12H5m14 0-4 4m4-4-4-4"
        />
      </svg>
    </a>
  </div>
</div>
